name = "tracker-dashboard-worker"
main = "src/index.ts"
compatibility_date = "2026-07-29"

[triggers]
crons = ["0 * * * *"]

[vars]
VERSION = "1.0.0"
SPREADSHEET_ID = "1U2EANvtDL1X2gOTcJInN84jSwrPPeddwjKiuFrt2Mtg"
TIME_ZONE = "Europe/Berlin"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "NUDGE_COORDINATOR"
class_name = "NudgeCoordinator"

[[migrations]]
tag = "v1-nudge-coordinator"
new_sqlite_classes = ["NudgeCoordinator"]

# Required secrets:
# wrangler secret put APP_API_TOKEN
# wrangler secret put ADDON_API_TOKEN
# wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON
# wrangler secret put APNS_KEY_ID
# wrangler secret put APNS_TEAM_ID
# wrangler secret put APNS_PRIVATE_KEY
# wrangler secret put APNS_TOPIC
